name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff pycryptodome
      - run: ruff check custom_components tests
      - run: pytest -q
      - name: Validate component metadata
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/gree_ac_cloud/manifest.json >/dev/null
